[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagquantum-compiler-qsteed"
version = "0.1.1"
description = "QSteed circuit compiler plugin for FlagQuantum"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "flagquantum>=0.2,<0.3",
    "qsteed==0.2.3+quafu.sqc",
]

[project.urls]
Repository = "https://github.com/FlagQuantum/FlagQuantum-Compiler-QSteed"
Issues = "https://github.com/FlagQuantum/FlagQuantum-Compiler-QSteed/issues"

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.entry-points."flagquantum.extensions"]
"compiler.qsteed" = "flagquantum_compiler_qsteed:create_extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
